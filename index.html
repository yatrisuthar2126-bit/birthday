<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Happy Birthday 🎂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap');

:root{
  --red-main:#f20f3a;
  --red-deep:#d90832;
  --red-dark:#a6072b;
  --cream:#fff7df;
  --paper:#fffdf7;
  --gold:#f5d36b;
  --night-main:#29294a;
  --night-deep:#1f1f3b;
  --night-glow:#45456c;
  --ink:#6b4636;
  --ink-light:#a98a72;
  --font-ui:'Poppins',sans-serif;
  --font-serif:'Cormorant Garamond',serif;
  --font-script:'Great Vibes',cursive;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-ui);
  overflow-x:hidden;
  overflow-y:hidden;
  width:100vw;height:100vh;
  position:relative;
  background:var(--red-dark);
}

button{font-family:inherit; border:none; cursor:pointer; background:none;}
img{display:block; max-width:100%;}

.screen{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transform:scale(.97);
  transition:opacity 1.1s ease, transform 1.1s ease;
  z-index:1;
  padding:24px;
  overflow:hidden;
}
.screen.active{
  opacity:1; pointer-events:auto; transform:scale(1); z-index:5;
}

/* ---------- red world ---------- */
.screen-red{
  background:
    radial-gradient(ellipse at 50% 40%, var(--red-main) 0%, var(--red-deep) 55%, var(--red-dark) 100%);
}

/* ---------- night world ---------- */
.screen-night{
  background:
    radial-gradient(ellipse at 50% 45%, var(--night-glow) 0%, var(--night-main) 55%, var(--night-deep) 100%);
}

.particles{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.particle{position:absolute; will-change:transform,opacity;}
.particle.dot{border-radius:50%; background:rgba(255,255,255,.55);}
.particle.gold{border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold);}
.particle.heart{color:rgba(255,255,255,.65); font-size:14px; line-height:1;}
.particle.heart::before{content:'♥';}
.particle.confetti{background:var(--gold); border-radius:2px;}

@keyframes drift{
  0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(-120px) translateX(var(--dx,20px)) rotate(180deg); opacity:0;}
}
@keyframes fall{
  0%{transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0;}
  8%{opacity:1;}
  100%{transform:translateY(110vh) translateX(var(--dx,30px)) rotate(360deg); opacity:.9;}
}

/* ============ SCREEN 1 : PIN ============ */
.pin-wrap{
  display:flex; align-items:center; justify-content:center; gap:clamp(20px,5vw,64px);
  flex-wrap:wrap; position:relative; z-index:2;
}

.memory-card{
  background:var(--paper);
  width:clamp(160px,22vw,200px);
  padding:14px 14px 20px;
  border-radius:6px;
  box-shadow:0 20px 40px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.2);
  transform:rotate(-4deg) scale(.9);
  opacity:0;
  position:relative;
}
.screen-pin.active .memory-card{animation:cardIn .9s .2s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes cardIn{ to{opacity:1; transform:rotate(-4deg) scale(1);} }
.memory-card .tape{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg);
  width:60px; height:22px;
  background:rgba(245,211,107,.55);
  border:1px solid rgba(245,211,107,.7);
}
.memory-card .photo{
  width:100%; aspect-ratio:4/5; object-fit:cover; border:4px solid #fff; border-radius:2px; box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.memory-card .caption{
  margin-top:12px; text-align:center; font-family:var(--font-serif); font-style:italic; color:var(--ink); font-size:14px;
}

.pin-panel{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; transform:translateY(14px);
}
.screen-pin.active .pin-panel{animation:panelIn .9s .35s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes panelIn{ to{opacity:1; transform:translateY(0);} }

.gift-icon{font-size:26px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
.pin-label{ color:rgba(255,255,255,.85); font-size:11px; letter-spacing:3px; font-weight:500; }
.pin-dots{display:flex; gap:12px; margin:4px 0 10px;}
.pin-dots .dot{
  width:12px; height:12px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.6);
  transition:background .25s ease, box-shadow .25s ease, transform .25s ease;
}
.pin-dots .dot.filled{
  background:var(--gold); box-shadow:0 0 8px var(--gold); transform:scale(1.15);
  border-color:var(--gold);
}
.pin-dots.shake{animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}

.keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.keypad button{
  width:clamp(46px,10vw,56px); height:clamp(46px,10vw,56px);
  border-radius:50%;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.28);
  color:#fff; font-size:17px; font-weight:500;
  display:flex; align-items:center; justify-content:center;
  transition:background .18s ease, transform .12s ease;
  opacity:0; transform:scale(.7);
}
.screen-pin.active .keypad button{animation:keyIn .5s cubic-bezier(.2,.8,.2,1) forwards;}
.keypad button:hover{background:rgba(255,255,255,.24);}
.keypad button:active{transform:scale(.9);}
.keypad button.spacer{visibility:hidden; pointer-events:none;}
@keyframes keyIn{ to{opacity:1; transform:scale(1);} }

.pin-hint{ margin-top:14px; font-size:11px; letter-spacing:.5px; color:rgba(255,255,255,.45); text-align:center; }

/* ============ SCREEN 2 : LETTER ============ */
.letter-wrap{
  display:flex; align-items:flex-start; justify-content:center; gap:clamp(20px,4vw,56px);
  flex-wrap:wrap; max-width:900px; position:relative; z-index:2;
}
.letter-col{display:flex; flex-direction:column; align-items:center; gap:22px;}

.letter-card{
  background:var(--paper);
  width:clamp(240px,32vw,340px);
  padding:clamp(24px,3vw,34px) clamp(20px,3vw,28px);
  border-radius:4px;
  box-shadow:0 24px 50px rgba(0,0,0,.35);
  opacity:0; transform:translateY(24px) scale(.96);
}
.screen-letter.active .letter-card{animation:letterIn 1s .15s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes letterIn{ to{opacity:1; transform:translateY(0) scale(1);} }

.letter-eyebrow{ font-size:11px; letter-spacing:5px; color:var(--ink-light); font-weight:600; text-align:center; }
.letter-title{
  font-family:var(--font-script); font-size:clamp(40px,6vw,56px); color:var(--red-deep);
  text-align:center; margin:4px 0 14px; line-height:1;
}
.letter-body p{
  font-family:var(--font-serif); font-style:italic; color:var(--ink); font-size:15px; line-height:1.7; margin-bottom:10px; text-align:center;
}
.letter-sign{ font-family:var(--font-script); font-size:22px; color:var(--red-deep); text-align:right; margin-top:14px; }

.memory-stack{display:flex; flex-direction:column; gap:16px;}
.memory-stack .ph{position:relative;}
.memory-stack img{
  width:clamp(180px,26vw,230px); height:110px; object-fit:cover;
  border:6px solid #fff; border-radius:2px; box-shadow:0 12px 26px rgba(0,0,0,.3);
  opacity:0; position:relative;
}
.memory-stack .ph .tape{
  position:absolute; top:-8px; left:16px; width:44px; height:18px; background:rgba(245,211,107,.55); border:1px solid rgba(245,211,107,.7); transform:rotate(-6deg); z-index:2;
}
.memory-stack .ph:nth-child(1) img{transform:rotate(2.5deg);}
.memory-stack .ph:nth-child(2) img{transform:rotate(-2deg);}
.memory-stack .ph:nth-child(3) img{transform:rotate(1.5deg);}
.screen-letter.active .memory-stack .ph:nth-child(1) img{animation:photoIn .8s .5s ease forwards;}
.screen-letter.active .memory-stack .ph:nth-child(2) img{animation:photoIn .8s .68s ease forwards;}
.screen-letter.active .memory-stack .ph:nth-child(3) img{animation:photoIn .8s .86s ease forwards;}
@keyframes photoIn{ from{opacity:0; transform:translateX(20px) scale(.94);} to{opacity:1;} }

.wish-btn{
  margin-top:6px;
  background:var(--cream); color:var(--red-dark);
  padding:13px 30px; border-radius:40px; font-size:14px; font-weight:600;
  box-shadow:0 10px 24px rgba(0,0,0,.25);
  opacity:0; transform:translateY(10px);
  transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
}
.screen-letter.active .wish-btn{animation:btnIn .7s 1.05s ease forwards;}
@keyframes btnIn{ to{opacity:1; transform:translateY(0);} }
.wish-btn:hover{transform:translateY(-2px); filter:brightness(1.05);}
.wish-btn:active{transform:translateY(0) scale(.96);}

/* ============ SCREEN 3 : WISH / CAKE ============ */
.wish-content{display:flex; flex-direction:column; align-items:center; position:relative; z-index:2;}
.wish-title{
  font-family:var(--font-script); font-size:clamp(38px,7vw,64px); color:var(--cream);
  text-shadow:0 0 24px rgba(255,247,223,.55);
  opacity:0; transform:translateY(16px);
}
.screen-wish.active .wish-title{animation:wishTitleIn 1s .2s ease forwards;}
@keyframes wishTitleIn{ to{opacity:1; transform:translateY(0);} }

.wish-subtitle{
  font-size:12px; color:rgba(255,247,223,.6); letter-spacing:.5px; margin-top:8px;
  opacity:0;
}
.screen-wish.active .wish-subtitle{animation:fadeUp .8s .5s ease forwards;}
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.cake-wrap{margin:36px 0 28px; opacity:0; transform:scale(.85); position:relative;}
.screen-wish.active .cake-wrap{animation:cakeIn .9s .55s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes cakeIn{ to{opacity:1; transform:scale(1);} }

.flame{cursor:pointer; transform-origin:bottom center; animation:flicker 1.4s ease-in-out infinite; transition:opacity .5s ease, transform .5s ease;}
.flame.out{animation:none; opacity:0; transform:scale(.2);}
@keyframes flicker{
  0%,100%{transform:scaleY(1) scaleX(1);}
  50%{transform:scaleY(1.12) scaleX(.94);}
}

.wish-btn2{
  background:transparent; color:var(--cream);
  border:1px solid rgba(255,247,223,.55);
  padding:12px 28px; border-radius:40px; font-size:13px; letter-spacing:.5px;
  box-shadow:0 0 18px rgba(255,247,223,.12);
  opacity:0; transform:translateY(10px);
  transition:filter .2s ease, transform .2s ease;
}
.screen-wish.active .wish-btn2{animation:btnIn .7s .9s ease forwards;}
.wish-btn2:hover{filter:brightness(1.3);}
.wish-btn2:active{transform:scale(.96);}

/* ============ SCREEN 4 : FINAL ============ */
.final-content{position:relative; z-index:2; text-align:center;}
.final-title{
  font-family:var(--font-script); color:var(--cream); font-size:clamp(46px,9vw,84px);
  text-shadow:0 0 30px rgba(255,247,223,.6), 0 2px 8px rgba(0,0,0,.3);
  filter:blur(6px); opacity:0; transform:translateY(20px);
  line-height:1.05;
}
.screen-final.active .final-title{animation:finalIn 1.2s .2s ease forwards;}
@keyframes finalIn{ to{filter:blur(0); opacity:1; transform:translateY(0);} }

.final-sub{
  font-family:var(--font-script); color:var(--cream); font-size:clamp(30px,6vw,52px);
  text-shadow:0 0 24px rgba(255,247,223,.5);
  filter:blur(6px); opacity:0; transform:translateY(16px);
}
.screen-final.active .final-sub{animation:finalIn 1.2s .55s ease forwards;}

.final-controls{margin-top:26px; display:flex; gap:12px; justify-content:center; opacity:0;}
.screen-final.active .final-controls{animation:fadeUp .8s 1.2s ease forwards;}
.pill-ghost{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35);
  padding:9px 20px; border-radius:30px; font-size:12px; letter-spacing:.3px;
  transition:background .2s ease, transform .15s ease;
}
.pill-ghost:hover{background:rgba(255,255,255,.22);}
.pill-ghost:active{transform:scale(.95);}

/* ---------- responsive ---------- */
@media(max-width:640px){
  .pin-wrap{flex-direction:column; gap:26px;}
  .letter-wrap{flex-direction:column; align-items:center;}
  .memory-stack{flex-direction:row; flex-wrap:wrap; justify-content:center;}
  .memory-stack img{width:100px; height:80px;}
}
</style>
</head>
<body>

<!-- SCREEN 1 : SECRET PASSWORD -->
<section class="screen screen-red screen-pin active" id="screen-pin">
  <div class="particles" id="particles-pin"></div>
  <div class="pin-wrap">
    <div class="memory-card">
      <div class="tape"></div>
      <img class="photo" id="card-photo" src="" alt="birthday memory">
      <div class="caption">happy birthday, My love! 🎂</div>
    </div>
    <div class="pin-panel">
      <div class="gift-icon">🎁</div>
      <div class="pin-label">ENTER PASSWORD</div>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="keypad" id="keypad"></div>
      <div class="pin-hint" id="pin-hint"></div>
    </div>
  </div>
</section>

<!-- SCREEN 2 : LETTER + MEMORIES -->
<section class="screen screen-red screen-letter" id="screen-letter">
  <div class="particles" id="particles-letter"></div>
  <div class="letter-wrap">
    <div class="letter-col">
      <div class="letter-card">
        <div class="letter-eyebrow">HAPPY</div>
        <div class="letter-title" id="letter-title"></div>
        <div class="letter-body" id="letter-body"></div>
        <div class="letter-sign" id="letter-sign"></div>
      </div>
      <button class="wish-btn" id="wish-btn">make a wish 💛</button>
    </div>
    <div class="memory-stack" id="memory-stack"></div>
  </div>
</section>

<!-- SCREEN 3 : MAKE A WISH -->
<section class="screen screen-night screen-wish" id="screen-wish">
  <div class="particles" id="particles-wish"></div>
  <div class="wish-content">
    <div class="wish-title">Make a wish...</div>
    <div class="wish-subtitle" id="wish-subtitle"></div>
    <div class="cake-wrap">
      <svg width="180" height="150" viewBox="0 0 180 150" id="cake-svg">
        <g id="candle-1">
          <rect x="52" y="46" width="8" height="26" rx="2" fill="#fff7df"/>
          <ellipse class="flame" data-idx="0" cx="56" cy="38" rx="6" ry="10" fill="#ffd36b"/>
        </g>
        <g id="candle-2">
          <rect x="86" y="40" width="8" height="32" rx="2" fill="#fff7df"/>
          <ellipse class="flame" data-idx="1" cx="90" cy="32" rx="6" ry="10" fill="#ffd36b"/>
        </g>
        <g id="candle-3">
          <rect x="120" y="46" width="8" height="26" rx="2" fill="#fff7df"/>
          <ellipse class="flame" data-idx="2" cx="124" cy="38" rx="6" ry="10" fill="#ffd36b"/>
        </g>
        <rect x="20" y="72" width="140" height="54" rx="14" fill="#fff7df"/>
        <rect x="20" y="72" width="140" height="16" rx="8" fill="#fffdf7"/>
        <rect x="10" y="120" width="160" height="18" rx="9" fill="#fff2cf"/>
      </svg>
    </div>
    <button class="wish-btn2" id="blow-btn">blow them out</button>
  </div>
</section>

<!-- SCREEN 4 : FINAL CELEBRATION -->
<section class="screen screen-red screen-final" id="screen-final">
  <div class="particles" id="particles-final"></div>
  <div class="final-content">
    <div class="final-title" id="final-title-1"></div>
    <div class="final-sub" id="final-title-2"></div>
    <div class="final-controls">
      <button class="pill-ghost" id="replay-btn">watch again ↺</button>
    </div>
  </div>
</section>

<script>
// ======================================
// EASY CUSTOMIZATION
// CHANGE YOUR IMAGES AND TEXT HERE
// ======================================
const CONFIG = {
  password: "1209",
  recipientName: "Annuu",
  cardImage: "image.jpg",
  memoryImages: [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg"
  ],
  letterText: {
    title: "Birthday",
    body: [
      "Another year of you being wonderfully, uniquely you.",
      "I hope today is filled with all the little things that make you smile, and a few big ones too.",
      "Thank you for every memory we've made — here's to many, many more."
    ]
  },
  signature: "— with love ❤️",
  wishSubtitle: "tap the candles to blow them out ♡",
  finalHeading: { line1: "Happiestt Birthdayy", line2: "Darlinggg!" }
};
// ======================================

// ---------- helpers ----------
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => Array.from(ctx.querySelectorAll(sel));
const rand = (a,b) => a + Math.random()*(b-a);

// ---------- particles ----------
function spawnParticles(containerId, count, types){
  const el = document.getElementById(containerId);
  if(!el) return;
  for(let i=0;i<count;i++){
    const type = types[Math.floor(Math.random()*types.length)];
    const p = document.createElement('div');
    p.className = 'particle ' + type;
    const size = rand(4,10);
    p.style.left = rand(2,98) + '%';
    p.style.top = rand(10,95) + '%';
    if(type!=='heart'){
      p.style.width = size+'px';
      p.style.height = size+'px';
    }
    p.style.setProperty('--dx', rand(-30,30)+'px');
    p.style.animation = `drift ${rand(6,12)}s ease-in-out ${rand(0,6)}s infinite`;
    el.appendChild(p);
  }
}
spawnParticles('particles-pin', 22, ['dot','gold','heart']);
spawnParticles('particles-letter', 18, ['dot','gold','heart']);
spawnParticles('particles-wish', 16, ['dot']);

// ---------- screen 1 : PIN ----------
$('#card-photo').src = CONFIG.cardImage;
$('#pin-hint').textContent = 'hint — digits only: ' + CONFIG.password.split('').join(' ');

const dotsEl = $('#pin-dots');
for(let i=0;i<CONFIG.password.length;i++){
  const d = document.createElement('div');
  d.className = 'dot';
  dotsEl.appendChild(d);
}

const keypadEl = $('#keypad');
const layout = ['1','2','3','4','5','6','7','8','9','','0','back'];
layout.forEach(key=>{
  const btn = document.createElement('button');
  if(key===''){ btn.className='spacer'; btn.disabled=true; }
  else if(key==='back'){ btn.textContent='⌫'; btn.dataset.action='back'; }
  else { btn.textContent=key; btn.dataset.digit=key; }
  keypadEl.appendChild(btn);
});

let pinInput = '';
let unlocking = false;

keypadEl.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn || unlocking) return;
  if(btn.dataset.action==='back'){
    pinInput = pinInput.slice(0,-1);
  } else if(btn.dataset.digit){
    if(pinInput.length < CONFIG.password.length) pinInput += btn.dataset.digit;
  } else return;
  renderPin();
});

function renderPin(){
  const dots = $$('.dot', dotsEl);
  dots.forEach((d,i)=> d.classList.toggle('filled', i < pinInput.length));
  if(pinInput.length === CONFIG.password.length){
    if(pinInput === CONFIG.password){
      unlocking = true;
      setTimeout(()=> goToScreen('screen-letter'), 500);
    } else {
      dotsEl.classList.remove('shake'); void dotsEl.offsetWidth;
      dotsEl.classList.add('shake');
      setTimeout(()=>{ pinInput=''; renderPin(); }, 450);
    }
  }
}

// ---------- screen 2 : LETTER ----------
$('#letter-title').textContent = CONFIG.letterText.title;
const letterBodyEl = $('#letter-body');
const bodyLines = CONFIG.recipientName
  ? ['Dear ' + CONFIG.recipientName + ',', ...CONFIG.letterText.body]
  : CONFIG.letterText.body;
bodyLines.forEach(line=>{
  const p = document.createElement('p');
  p.textContent = line;
  letterBodyEl.appendChild(p);
});
$('#letter-sign').textContent = CONFIG.signature;

const stackEl = $('#memory-stack');
CONFIG.memoryImages.forEach(src=>{
  const wrap = document.createElement('div');
  wrap.className = 'ph';
  wrap.innerHTML = `<div class="tape"></div><img src="${src}" alt="memory">`;
  stackEl.appendChild(wrap);
});

$('#wish-btn').addEventListener('click', ()=> goToScreen('screen-wish'));

// ---------- screen 3 : WISH / CAKE ----------
$('#wish-subtitle').textContent = CONFIG.wishSubtitle;

const flames = $$('.flame');
function extinguish(flame){
  if(flame.classList.contains('out')) return;
  flame.classList.add('out');
  spawnSmoke(flame);
}
flames.forEach(f=> f.addEventListener('click', ()=> extinguish(f)));

function spawnSmoke(flame){
  const svg = $('#cake-svg');
  const wrap = svg.parentElement;
  const rect = flame.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const puff = document.createElement('div');
  puff.style.position='absolute';
  puff.style.left = (rect.left - wrapRect.left + rect.width/2 - 4) + 'px';
  puff.style.top = (rect.top - wrapRect.top - 4) + 'px';
  puff.style.width='8px'; puff.style.height='8px'; puff.style.borderRadius='50%';
  puff.style.background='rgba(255,255,255,.5)';
  puff.style.pointerEvents='none';
  puff.style.transition='transform 1s ease, opacity 1s ease';
  wrap.appendChild(puff);
  requestAnimationFrame(()=>{
    puff.style.transform='translateY(-30px) scale(2.4)';
    puff.style.opacity='0';
  });
  setTimeout(()=> puff.remove(), 1100);
}

$('#blow-btn').addEventListener('click', ()=>{
  flames.forEach(f=>{ if(!f.classList.contains('out')) extinguish(f); });
  setTimeout(()=> goToScreen('screen-final'), 700);
});

// ---------- screen 4 : FINAL ----------
$('#final-title-1').textContent = CONFIG.finalHeading.line1;
$('#final-title-2').textContent = CONFIG.finalHeading.line2;
$('#replay-btn').addEventListener('click', ()=>{
  pinInput=''; renderPin();
  flames.forEach(f=> f.classList.remove('out'));
  unlocking=false;
  goToScreen('screen-pin');
});

function fillFinalParticles(){
  const el = $('#particles-final');
  el.innerHTML = '';
  const types = ['dot','gold','heart','confetti'];
  for(let i=0;i<55;i++){
    const type = types[Math.floor(Math.random()*types.length)];
    const p = document.createElement('div');
    p.className = 'particle ' + type;
    const size = rand(4,10);
    p.style.left = rand(0,100) + '%';
    p.style.top = '-5%';
    if(type!=='heart'){ p.style.width=size+'px'; p.style.height=size+'px'; }
    p.style.setProperty('--dx', rand(-40,40)+'px');
    p.style.animation = `fall ${rand(5,10)}s linear ${rand(0,4)}s infinite`;
    el.appendChild(p);
  }
}

// ---------- state machine ----------
const screens = $$('.screen');
function goToScreen(id){
  screens.forEach(s=> s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screen-final') fillFinalParticles();
}
</script>
</body>
